# Minimal check for the skeleton. T03 replaces this with the full CI workflow.
name: skeleton
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test DiskEngine
        run: swift test --package-path Packages/DiskEngine
      - name: Generate project
        run: xcodegen generate
      - name: Build and test app
        run: xcodebuild test -project DiskOptimizer.xcodeproj -scheme DiskOptimizer -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO
