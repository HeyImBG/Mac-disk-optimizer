name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26.6"

jobs:
  engine:
    name: DiskEngine tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: Test DiskEngine
        run: swift test --package-path Packages/DiskEngine

  app:
    name: App build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version
      - name: Generate project
        run: xcodegen generate
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project DiskOptimizer.xcodeproj \
            -scheme DiskOptimizer \
            -destination 'platform=macOS' \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test.xcresult
          retention-days: 7
